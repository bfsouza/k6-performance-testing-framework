services:
  influxdb:
    image: influxdb:1.8
    container_name: k6-influxdb
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
    volumes:
      - influxdb_data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:10.4.2
    container_name: k6-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana

  k6:
    image: grafana/k6:0.45.0
    container_name: k6-runner
    depends_on:
      - influxdb
    environment:
      K6_OUT: influxdb=http://influxdb:8086/k6
    volumes:
      - ./src:/scripts
      - ./config:/config
    command: run /scripts/tests/smoke.js
    working_dir: /scripts

volumes:
  influxdb_data:
  grafana_data:
